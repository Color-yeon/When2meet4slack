<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드 - 약속 일정 서비스</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>약속 일정 서비스</h1>
      <p class="subtitle">내 약속 목록을 확인하고 관리하세요</p>
    </header>
    
    <main>
      <!-- 로그인 섹션 -->
      <div class="card" id="loginSection">
        <h2>로그인</h2>
        <p>서비스를 이용하려면 로그인이 필요합니다.</p>
        
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="phoneNumber">전화번호</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="01012345678" required>
            <p class="form-hint">전화번호는 '-' 없이 입력해주세요.</p>
          </div>
          
          <button type="submit" class="button primary">로그인</button>
        </form>
      </div>
      
      <!-- 대시보드 섹션 (로그인 후 표시) -->
      <div class="card" id="dashboardSection" style="display: none;">
        <div class="card-header">
          <h2>내 약속 목록</h2>
          <button class="button small" id="createEventButton">+ 새 약속</button>
        </div>
        
        <div id="eventsList" class="events-list">
          <p class="empty-state">아직 약속이 없습니다. 새 약속을 만들어보세요!</p>
        </div>
        
        <div class="user-info">
          <p>로그인 사용자: <span id="userPhoneNumber"></span></p>
          <button class="button small secondary" id="logoutButton">로그아웃</button>
        </div>
      </div>
      
      <div class="buttons">
        <a href="index.html" class="button secondary">홈으로 돌아가기</a>
      </div>
    </main>
    
    <footer>
      <p>&copy; 2023 약속 일정 서비스. All rights reserved.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
