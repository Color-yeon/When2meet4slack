<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 약속 일정 서비스</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>약속 일정 서비스</h1>
      <p class="subtitle">로그인하여 서비스를 이용하세요</p>
    </header>
    
    <main>
      <div class="card">
        <h2>로그인</h2>
        <p>서비스를 이용하려면 로그인이 필요합니다.</p>
        
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="phoneNumber">전화번호</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="01012345678" required>
            <p class="form-hint">전화번호는 '-' 없이 입력해주세요.</p>
          </div>
          
          <button type="submit" class="button primary">로그인</button>
        </form>
      </div>
      
      <div class="buttons">
        <a href="index.html" class="button secondary">홈으로 돌아가기</a>
      </div>
    </main>
    
    <footer>
      <p>&copy; 2023 약속 일정 서비스. All rights reserved.</p>
    </footer>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 로그인 폼 이벤트 리스너
      const loginForm = document.getElementById("loginForm");
      if (loginForm) {
        loginForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const phoneNumber = document.getElementById("phoneNumber").value;
          
          // 전화번호 유효성 검사 (간단한 검증)
          if (phoneNumber.length < 10 || phoneNumber.length > 11 || !/^\d+$/.test(phoneNumber)) {
            alert("유효한 전화번호를 입력해주세요. (10-11자리 숫자)");
            return;
          }
          
          // 로그인 처리
          const user = { phoneNumber };
          localStorage.setItem("user", JSON.stringify(user));
          
          // 대시보드로 리디렉션
          window.location.href = "dashboard.html";
        });
      }
      
      // 이미 로그인한 경우 대시보드로 리디렉션
      const userJson = localStorage.getItem("user");
      if (userJson) {
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
